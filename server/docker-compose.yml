services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sixiang
      POSTGRES_PASSWORD: sixiang
      POSTGRES_DB: sixiang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sixiang"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sixiang:sixiang@db:5432/sixiang
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
