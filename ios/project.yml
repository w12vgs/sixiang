name: Sixiang
options:
  bundleIdPrefix: app.sixiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES

targets:
  Sixiang:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: SixiangWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sixiang.workbench
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Sixiang.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SixiangWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sixiang.workbench.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/SixiangWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  Sixiang:
    build:
      targets:
        Sixiang: all
        SixiangWidget: all
    run:
      config: Debug
    archive:
      config: Release
